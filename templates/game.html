<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Durak Online — Dynamic Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/game.css">
</head>
<script>
  (function() {
    const s = JSON.parse(localStorage.getItem('durak_app_settings') || '{}');
    if (s.lang === 'en') {
      const invBtn = document.getElementById('btn-invite');
      if (invBtn) invBtn.textContent = '➕ Invite Friends';
      const invTitle = document.querySelector('#invite-popup .invite-header span');
      if (invTitle) invTitle.textContent = 'Invite Friends';
      const mainBtn = document.getElementById('main-btn');
      if (mainBtn && mainBtn.textContent.trim() === 'Готово') mainBtn.textContent = 'Ready';
    }
  })();
</script>
<body>

<div class="phone">

  <div class="top-bar">
    <div class="btn-icon-top">🔄</div>
    <div class="game-modes" id="top-game-modes">
      </div>
    <div class="cash-display"><span id="top-game-bet">36</span> <span style="font-size:16px;">🃏</span></div>
  </div>

  <div class="opponents-area" id="opponents-area">
    </div>

  <div class="deck-area" id="deck-area" style="opacity: 0;">
    <div class="cards-left-floating" id="cards-left">24</div>
    <div class="trump-wrapper" id="trump-container"></div>
    <div class="deck-stack">
      <div class="card-back"></div>
      <div class="card-back"></div>
      <div class="card-back top-card"></div>
    </div>
  </div>

  <div class="battle-area" id="battle-area">
  </div>

  <div class="player-hand-anchor" id="player-hand">
  </div>

  <button class="btn-invite" id="btn-invite" onclick="frends_lst()">➕ Пригласить друзей</button>

  <div class="invite-popup" id="invite-popup">
    <div class="invite-header">
      <span style="font-weight: 700; font-size: 16px;">Пригласить друзей</span>
      <button class="invite-close" id="invite-close">❌</button>
    </div>
    <div class="invite-list">
      </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-action primary hidden" id="main-btn">Готово</button>
    
    <div class="player-profile active-turn" onclick="document.getElementById('emoji-popup').classList.toggle('show')">
      <div class="player-avatar">M</div>
      <div class="player-name">Mike</div>
      <div class="chat-badge">💬</div>
      
      <div class="emoji-popup" id="emoji-popup">
        <span class="emoji-btn">😀</span>
        <span class="emoji-btn">😂</span>
        <span class="emoji-btn">😡</span>
        <span class="emoji-btn">🚀</span>
        <span class="emoji-btn">👎</span>
      </div>
    </div>

    <div class="bottom-actions-container">
      <div class="action-buttons-row">
        <div class="action-item">
          <div class="action-val">1<span class="coin-mini">🪙</span></div>
          <div class="action-btn-white"><span style="color:var(--red)">❌</span></div>
        </div>
        <div class="action-item">
          <div class="action-val">3<span class="coin-mini">🪙</span></div>
          <div class="action-btn-white"><span style="color:var(--red)">👁️</span></div>
        </div>
        <div class="action-item">
          <div class="action-val">2<span class="coin-mini">🪙</span></div>
          <div class="action-btn-white"><span style="color:var(--red)">🔍</span></div>
        </div>
      </div>
      <div class="action-bottom-vals" style="justify-content: center;">
        <span style="color: var(--amber);">5🪙</span>
      </div>
    </div>
  </div>

</div>
<script src="../static/socket.io.min.js"></script>
<script src="../static/game.js"></script>
</body>
</html>
